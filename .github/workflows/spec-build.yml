name: Spec build

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
    branches:
      - main

# Supersede in-progress runs for the same ref, but let main runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Builds main as the baseline for the pull request diff.
  build_reference:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # We now refer to the container by its SHA instead of the name, to prevent
    # caching problems when updating the image.
    # container: khronosgroup/docker-images:asciidoctor-spec.20240726
    container: khronosgroup/docker-images@sha256:089687083ceb36483a3917389e4278718ab19c594099634f5dd80e22540c960f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          submodules: true
      - name: Build Specs
        run: |
          make html
          mkdir -p latest
          find specs -name "*.html" -exec cp {} latest  \;
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: previous_rev
          path: latest

  build_specs:
    runs-on: ubuntu-latest
    # build_reference is skipped on push events, and a skipped dependency would
    # otherwise skip this job too.
    needs: build_reference
    if: ${{ !cancelled() && needs.build_reference.result != 'failure' }}
    # We now refer to the container by its SHA instead of the name, to prevent
    # caching problems when updating the image.
    # container: khronosgroup/docker-images:asciidoctor-spec.20240726
    container: khronosgroup/docker-images@sha256:089687083ceb36483a3917389e4278718ab19c594099634f5dd80e22540c960f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Get reference build
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: previous_rev
      - name: create artifact folder
        run: |
          mkdir artifact
      - name: Install link checker and diff dependencies
        run: |
          apt-get update && apt-get install -y tidy
          python3 -m pip install requests beautifulsoup4 utidylib
          python3 -c "import tidy"
      - name: Build HTML Specs
        run: |
          make html
          make check
          cp specs/*.html artifact
      - name: Build PDF Specs
        run: |
          make -C specs pdf
          cp specs/*.pdf artifact
      - name: Build diff
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          make diff-dev
      - name: Save dev artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diffs
          path: diff
      - name: Save release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: artifact
